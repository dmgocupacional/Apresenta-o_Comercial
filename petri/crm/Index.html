<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<title>PETRI CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--terra:#B5562E;--terra-2:#D27A50;--terra-claro:#F3E4DA;--carvao:#2F2926;--cinza:#6F6661;--linha:#E7DED6;--creme:#FAF6F1;--branco:#fff;--verde:#3E7B5A;--amarelo:#C89B2C;--vermelho:#A8412F;--raio:14px;--sombra:0 1px 2px rgba(47,41,38,.06),0 8px 24px rgba(47,41,38,.06)}
*{box-sizing:border-box}
body{margin:0;font-family:Archivo,system-ui,sans-serif;background:var(--creme);color:var(--carvao);font-size:14px}
header{position:sticky;top:0;z-index:5;background:var(--carvao);color:var(--creme);display:flex;align-items:center;gap:16px;padding:12px 20px;flex-wrap:wrap}
.marca{font-weight:800;letter-spacing:.14em;font-size:15px}
.marca span{color:var(--terra-2)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:transparent;color:#D8CEC6;border:0;padding:8px 12px;border-radius:999px;font:inherit;font-weight:600;cursor:pointer}
nav button.ativo{background:var(--terra);color:#fff}
.acoes{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer}
.btn-pri{background:var(--terra);color:#fff}
.qtd-rodar{display:flex;align-items:center;gap:6px;color:#F3EDE8;font-size:13px;font-weight:600}
.qtd-rodar input{width:72px;border:0;border-radius:999px;padding:8px 10px;font:inherit;font-weight:700;text-align:center;background:#453C38;color:#fff}
.btn-sec{background:#453C38;color:#F2EAE3}
.btn-claro{background:var(--terra-claro);color:var(--carvao)}
.btn:disabled{opacity:.5;cursor:wait}
main{padding:20px;max-width:1400px;margin:0 auto}
.aviso{background:#FFF4E5;border:1px solid #F1D3A5;border-radius:var(--raio);padding:12px 16px;margin-bottom:16px}
.oculto{display:none}
.grade{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--branco);border:1px solid var(--linha);border-radius:var(--raio);padding:18px;box-shadow:var(--sombra)}
.kpi-rot{color:var(--cinza);font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.kpi-val{font-size:34px;font-weight:800;margin-top:6px}
.kpi-sub{color:var(--cinza);font-size:12px;margin-top:2px}
.barra{height:8px;background:var(--terra-claro);border-radius:99px;overflow:hidden;margin-top:10px}
.barra i{display:block;height:100%;background:var(--terra);border-radius:99px}
h2{font-size:15px;margin:0 0 14px;font-weight:700}
.funil-linha{display:grid;grid-template-columns:150px 1fr 60px;align-items:center;gap:10px;margin:8px 0}
.funil-barra{height:22px;background:var(--terra-claro);border-radius:6px;overflow:hidden}
.funil-barra i{display:block;height:100%;background:linear-gradient(90deg,var(--terra),var(--terra-2))}
.num{text-align:right;font-weight:700}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--cinza);padding:8px;border-bottom:1px solid var(--linha);font-weight:600}
td{padding:9px 8px;border-bottom:1px solid var(--linha);vertical-align:top}
tr.clicavel{cursor:pointer}
tr.clicavel:hover td{background:#FBF4EE}
.tag{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;background:var(--terra-claro);color:var(--terra)}
.tag-ok{background:#E3F0E8;color:var(--verde)}
.tag-alerta{background:#F7EDD5;color:var(--amarelo)}
.tag-ruim{background:#F5E1DC;color:var(--vermelho)}
.muted{color:var(--cinza)}
.kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px}
.coluna{min-width:240px;width:240px;background:#F1EAE3;border-radius:var(--raio);padding:10px;flex-shrink:0}
.coluna.sobre{outline:2px dashed var(--terra)}
.coluna-tit{display:flex;justify-content:space-between;font-weight:700;font-size:13px;margin:4px 4px 10px}
.lead-card{background:#fff;border:1px solid var(--linha);border-radius:10px;padding:10px;margin-bottom:8px;cursor:grab}
.lead-card b{display:block;font-size:13px}
.lead-card small{color:var(--cinza)}
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select,textarea{font:inherit;border:1px solid var(--linha);border-radius:10px;padding:8px 10px;background:#fff;color:var(--carvao)}
input.busca{flex:1;min-width:220px}
textarea{width:100%;min-height:160px}
.painel-lateral{position:fixed;top:0;right:0;width:min(560px,100%);height:100%;background:#fff;box-shadow:-10px 0 40px rgba(0,0,0,.15);z-index:20;overflow-y:auto;padding:22px}
.fechar{float:right}
.email{border:1px solid var(--linha);border-radius:10px;padding:12px;margin:10px 0;background:var(--creme)}
.email-cab{font-size:12px;color:var(--cinza);margin-bottom:6px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--carvao);color:#fff;padding:12px 18px;border-radius:12px;z-index:30;max-width:90%}
.campo{display:grid;gap:4px;margin-bottom:10px}
.campo label{font-size:12px;color:var(--cinza);font-weight:600}
.linha-flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mt{margin-top:16px}
.vazio{padding:30px;text-align:center;color:var(--cinza)}
@media(max-width:700px){main{padding:12px}.funil-linha{grid-template-columns:110px 1fr 40px}}
</style>
</head>
<body>
<header>
  <div class="marca">PETRI <span>CRM</span></div>
  <nav id="nav">
    <button data-aba="painel" class="ativo">Painel</button>
    <button data-aba="funil">Funil</button>
    <button data-aba="leads">Leads</button>
    <button data-aba="reunioes">Reuniões</button>
    <button data-aba="sequencias">Sequências</button>
  </nav>
  <div class="acoes">
    <button class="btn btn-sec" id="bImportar">⇣ Importar</button>
    <button class="btn btn-sec" id="bSync">↻ Respostas e agenda</button>
    <label class="qtd-rodar" title="Quantos e-mails enviar agora (0 = toda a fila)">Enviar <input type="number" id="qtdRodar" min="0" step="1"> e-mails</label>
    <button class="btn btn-pri" id="bRodar">▶ Rodar o dia</button>
  </div>
</header>


<main>
  <div id="avisos"></div>
  <section id="aba-painel"></section>
  <section id="aba-funil" class="oculto"></section>
  <section id="aba-leads" class="oculto"></section>
  <section id="aba-reunioes" class="oculto"></section>
  <section id="aba-sequencias" class="oculto"></section>
</main>
<div id="lateral" class="painel-lateral oculto"></div>
<div id="toast" class="toast oculto"></div>


<script>
// ═══ BLOCO: CONSTANTES ═══
const META_SEMANA = 2;
const COR_ETAPA = {
  'Respondeu': 'tag-alerta', 'Reunião agendada': 'tag-ok', 'Reunião realizada': 'tag-ok',
  'Proposta': 'tag-ok', 'Ganho': 'tag-ok', 'Perdido': 'tag-ruim', 'Descartado': 'tag-ruim', 'Sem resposta': 'tag-ruim'
};
const ETAPAS_FUNIL = ['Em sequência', 'Respondeu', 'Reunião agendada', 'Reunião realizada', 'Proposta', 'Ganho'];
// ── FIM BLOCO ──


// ═══ BLOCO: ESTADO ═══
let D = { leads: [], envios: [], nichos: [], seq: [], etapas: [], config: {}, importar: 0 };
let abaAtual = 'painel';
let filtro = { texto: '', etapa: '', nicho: '' };
let arrastando = null;
let nichoSeq = '*';
// ── FIM BLOCO ──


// ═══ BLOCO: HELPERS ═══
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtData = iso => iso ? new Date(iso).toLocaleDateString('pt-BR') : '';
const fmtDataHora = iso => iso ? new Date(iso).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
const tagEtapa = e => `<span class="tag ${COR_ETAPA[e] || ''}">${esc(e)}</span>`;
const nomeNicho = id => (D.nichos.find(n => n.id === id) || {}).nome || id || '—';


function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.remove('oculto');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.add('oculto'), 4500);
}


function chamar(fn, ...args) {
  return new Promise((ok, erro) => {
    google.script.run.withSuccessHandler(ok).withFailureHandler(erro)[fn](...args);
  });
}


function inicioSemana() {
  const d = new Date(); d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return d;
}
// ── FIM BLOCO ──


// ═══ BLOCO: NEGÓCIO ═══
function contarEtapas() {
  const c = {};
  D.leads.forEach(l => { c[l.etapa] = (c[l.etapa] || 0) + 1; });
  return c;
}


/** Quantos leads já passaram por cada etapa do funil (etapa atual ou posterior). */
function funilAcumulado() {
  const c = contarEtapas();
  return ETAPAS_FUNIL.map((e, i) => ({
    etapa: e,
    n: ETAPAS_FUNIL.slice(i).reduce((s, x) => s + (c[x] || 0), 0)
  }));
}


function kpis() {
  const ini = inicioSemana();
  const reunSemana = D.leads.filter(l => l.reuniao_em && new Date(l.reuniao_em) >= ini &&
    ['Reunião agendada', 'Reunião realizada', 'Proposta', 'Ganho'].includes(l.etapa)).length;
  const enviosSemana = D.envios.filter(e => new Date(e.data) >= ini && String(e.status).startsWith('enviado')).length;
  const contatados = D.leads.filter(l => Number(l.passo) > 0).length;
  const responderam = D.leads.filter(l => l.ultima_resposta).length;
  const hoje = new Date(); hoje.setHours(23, 59, 59);
  const fila = D.leads.filter(l => ['Novo', 'Em sequência'].includes(l.etapa) && (!l.proximo_envio || new Date(l.proximo_envio) <= hoje)).length;
  return {
    reunSemana, enviosSemana, fila,
    taxaResp: contatados ? Math.round(responderam / contatados * 100) : 0,
    contatados
  };
}


function porNicho() {
  return D.nichos.map(n => {
    const ls = D.leads.filter(l => l.nicho === n.id);
    const cont = ls.filter(l => Number(l.passo) > 0).length;
    const resp = ls.filter(l => l.ultima_resposta).length;
    const reun = ls.filter(l => l.reuniao_em).length;
    return { nome: n.nome, total: ls.length, cont, resp, reun, taxa: cont ? Math.round(reun / cont * 100) : 0 };
  });
}


function leadsFiltrados() {
  const t = filtro.texto.toLowerCase();
  return D.leads.filter(l =>
    (!filtro.etapa || l.etapa === filtro.etapa) &&
    (!filtro.nicho || l.nicho === filtro.nicho) &&
    (!t || [l.empresa, l.contato, l.email, l.cidade, l.cargo].join(' ').toLowerCase().includes(t))
  ).sort((a, b) => (Number(b.score) || 0) - (Number(a.score) || 0));
}


function reunioes() {
  return D.leads.filter(l => l.reuniao_em).sort((a, b) => new Date(a.reuniao_em) - new Date(b.reuniao_em));
}
// ── FIM BLOCO ──


// ═══ BLOCO: RENDER ═══
function renderAvisos() {
  const a = [];
  if (!D.config.LINK_AGENDA) a.push('Preencha <b>LINK_AGENDA</b> na aba Config da planilha. Sem ele o envio fica bloqueado.');
  if (!D.config.AGENDA_FRANCO) a.push('Preencha <b>AGENDA_FRANCO</b> na aba Config para as reuniões entrarem sozinhas no funil.');
  if (D.importar > 0) a.push(`Há <b>${D.importar}</b> linha(s) na aba Importar. Clique em ⇣ Importar.`);
  $('#avisos').innerHTML = a.map(x => `<div class="aviso">${x}</div>`).join('');
}


function renderPainel() {
  const k = kpis();
  const pct = Math.min(100, Math.round(k.reunSemana / META_SEMANA * 100));
  const fun = funilAcumulado();
  const topo = fun[0].n || 1;
  const nichos = porNicho();
  $('#aba-painel').innerHTML = `
    <div class="grade g4">
      <div class="card"><div class="kpi-rot">Reuniões na semana</div><div class="kpi-val">${k.reunSemana}<span class="muted"> / ${META_SEMANA}</span></div>
        <div class="barra"><i style="width:${pct}%"></i></div></div>
      <div class="card"><div class="kpi-rot">Fila de hoje</div><div class="kpi-val">${k.fila}</div><div class="kpi-sub">escolha a quantidade ao lado de Rodar o dia</div></div>
      <div class="card"><div class="kpi-rot">Envios na semana</div><div class="kpi-val">${k.enviosSemana}</div><div class="kpi-sub">${k.contatados} lead(s) já contatados</div></div>
      <div class="card"><div class="kpi-rot">Taxa de resposta</div><div class="kpi-val">${k.taxaResp}%</div><div class="kpi-sub">sobre leads contatados</div></div>
    </div>
    <div class="grade g2 mt">
      <div class="card"><h2>Funil</h2>
        ${fun.map((f, i) => `<div class="funil-linha"><span>${esc(f.etapa)}</span>
          <div class="funil-barra"><i style="width:${Math.round(f.n / topo * 100)}%"></i></div>
          <span class="num">${f.n}${i ? ` <small class="muted">${fun[i - 1].n ? Math.round(f.n / fun[i - 1].n * 100) : 0}%</small>` : ''}</span></div>`).join('')}
      </div>
      <div class="card"><h2>Desempenho por nicho</h2>
        <table><thead><tr><th>Nicho</th><th>Leads</th><th>Contatados</th><th>Respostas</th><th>Reuniões</th></tr></thead><tbody>
        ${nichos.map(n => `<tr><td>${esc(n.nome)}</td><td>${n.total}</td><td>${n.cont}</td><td>${n.resp}</td><td><b>${n.reun}</b> <small class="muted">${n.taxa}%</small></td></tr>`).join('')}
        </tbody></table>
      </div>
    </div>`;
}


function renderFunil() {
  const cols = D.etapas.map(e => {
    const ls = D.leads.filter(l => l.etapa === e);
    return `<div class="coluna" data-etapa="${esc(e)}">
      <div class="coluna-tit"><span>${esc(e)}</span><span class="muted">${ls.length}</span></div>
      ${ls.slice(0, 150).map(l => `<div class="lead-card" draggable="true" data-id="${esc(l.id)}">
        <b>${esc(l.empresa)}</b><small>${esc(l.contato || '')}${l.cargo ? ' · ' + esc(l.cargo) : ''}</small><br>
        <small>${esc(nomeNicho(l.nicho))} · passo ${Number(l.passo) || 0}</small></div>`).join('')}
      ${ls.length > 150 ? `<small class="muted">+${ls.length - 150} na aba Leads</small>` : ''}
    </div>`;
  }).join('');
  $('#aba-funil').innerHTML = `<div class="kanban">${cols}</div>`;
}


function renderLeads() {
  const ls = leadsFiltrados();
  $('#aba-leads').innerHTML = `
    <div class="filtros">
      <input class="busca" id="fTexto" placeholder="Buscar empresa, contato, e-mail, cidade…" value="${esc(filtro.texto)}">
      <select id="fEtapa"><option value="">Todas as etapas</option>${D.etapas.map(e => `<option ${e === filtro.etapa ? 'selected' : ''}>${esc(e)}</option>`).join('')}</select>
      <select id="fNicho"><option value="">Todos os nichos</option>${D.nichos.map(n => `<option value="${esc(n.id)}" ${n.id === filtro.nicho ? 'selected' : ''}>${esc(n.nome)}</option>`).join('')}</select>
    </div>
    <div class="card">
      ${ls.length ? `<table><thead><tr><th>Score</th><th>Empresa</th><th>Contato</th><th>Nicho</th><th>Etapa</th><th>Passo</th><th>Próximo envio</th></tr></thead><tbody>
      ${ls.slice(0, 500).map(l => `<tr class="clicavel" data-id="${esc(l.id)}"><td><b>${esc(l.score)}</b></td><td>${esc(l.empresa)}<br><small class="muted">${esc(l.cidade || '')}</small></td>
        <td>${esc(l.contato || '')}<br><small class="muted">${esc(l.email || '')}</small></td><td>${esc(nomeNicho(l.nicho))}</td>
        <td>${tagEtapa(l.etapa)}</td><td>${Number(l.passo) || 0}</td><td>${fmtData(l.proximo_envio)}</td></tr>`).join('')}
      </tbody></table>${ls.length > 500 ? `<p class="muted">Mostrando 500 de ${ls.length}. Refine a busca.</p>` : ''}`
      : '<div class="vazio">Nenhum lead. Cole leads na aba Importar da planilha e clique em ⇣ Importar.</div>'}
    </div>`;
}


function renderReunioes() {
  const rs = reunioes();
  $('#aba-reunioes').innerHTML = `<div class="card">${rs.length ? `<table><thead><tr><th>Quando</th><th>Empresa</th><th>Contato</th><th>Nicho</th><th>Etapa</th></tr></thead><tbody>
    ${rs.map(l => `<tr class="clicavel" data-id="${esc(l.id)}"><td><b>${fmtDataHora(l.reuniao_em)}</b></td><td>${esc(l.empresa)}</td>
      <td>${esc(l.contato || '')}<br><small class="muted">${esc(l.email)}</small></td><td>${esc(nomeNicho(l.nicho))}</td><td>${tagEtapa(l.etapa)}</td></tr>`).join('')}
    </tbody></table>` : '<div class="vazio">Nenhuma reunião ainda. Quando um lead reservar na agenda do Franco, ela aparece aqui sozinha.</div>'}</div>`;
}


function renderSequencias() {
  const opcoes = [{ id: '*', nome: 'Padrão (todos os nichos)' }].concat(D.nichos);
  const passos = D.seq.filter(s => s.nicho === nichoSeq).sort((a, b) => a.passo - b.passo);
  const base = passos.length ? passos : D.seq.filter(s => s.nicho === '*').sort((a, b) => a.passo - b.passo);
  $('#aba-sequencias').innerHTML = `
    <div class="filtros"><select id="sNicho">${opcoes.map(o => `<option value="${esc(o.id)}" ${o.id === nichoSeq ? 'selected' : ''}>${esc(o.nome)}</option>`).join('')}</select>
      ${!passos.length && nichoSeq !== '*' ? '<span class="muted">Este nicho usa a sequência padrão. Ao salvar um passo, ele ganha a sua própria.</span>' : ''}</div>
    <p class="muted">Variáveis: {{primeiro_nome}} {{empresa}} {{cargo}} {{cidade}} {{nicho_nome}} {{dor}} {{clientes}} {{gancho}} {{link_agenda}} {{assinatura}}</p>
    <div class="grade g2">${base.map(p => `<div class="card">
      <div class="linha-flex"><h2>Passo ${p.passo}</h2><span class="muted">dia</span><input type="number" min="0" class="sDia" data-passo="${p.passo}" value="${esc(p.dia)}"></div>
      <div class="campo"><label>Assunto ${p.passo > 1 ? '(vazio = responde na mesma conversa)' : ''}</label><input class="sAssunto" data-passo="${p.passo}" value="${esc(p.assunto)}"></div>
      <div class="campo"><label>Corpo (HTML)</label><textarea class="sCorpo" data-passo="${p.passo}">${esc(p.corpo)}</textarea></div>
      <button class="btn btn-claro sSalvar" data-passo="${p.passo}">Salvar passo ${p.passo}</button></div>`).join('')}</div>`;
}


function renderLateral(lead, previa) {
  const el = $('#lateral');
  el.innerHTML = `<button class="btn btn-claro fechar" id="lFechar">Fechar</button>
    <h2>${esc(lead.empresa)}</h2>
    <p>${esc(lead.contato || '')}${lead.cargo ? ' · ' + esc(lead.cargo) : ''}<br><span class="muted">${esc(lead.email)} ${lead.telefone ? '· ' + esc(lead.telefone) : ''}</span></p>
    <div class="linha-flex">${tagEtapa(lead.etapa)}<span class="muted">${esc(nomeNicho(lead.nicho))} · score ${esc(lead.score)}</span></div>
    <div class="campo mt"><label>Mover para</label><select id="lEtapa">${D.etapas.map(e => `<option ${e === lead.etapa ? 'selected' : ''}>${esc(e)}</option>`).join('')}</select></div>
    <div class="campo"><label>Observações</label><textarea id="lObs">${esc(lead.obs || '')}</textarea></div>
    <button class="btn btn-pri" id="lSalvar" data-id="${esc(lead.id)}">Salvar</button>
    <h2 class="mt">Sequência deste lead</h2>
    ${previa ? previa.map(p => `<div class="email"><div class="email-cab">Passo ${p.passo} · dia ${p.dia}${Number(lead.passo) >= p.passo ? ' · ✓ enviado' : ''}<br><b>${esc(p.assunto)}</b></div>${p.html}</div>`).join('') : '<p class="muted">Carregando…</p>'}`;
  el.classList.remove('oculto');
}


function render() {
  renderAvisos();
  ({ painel: renderPainel, funil: renderFunil, leads: renderLeads, reunioes: renderReunioes, sequencias: renderSequencias })[abaAtual]();
}
// ── FIM BLOCO ──


// ═══ BLOCO: EVENTOS E INICIALIZAÇÃO ═══
async function carregar() {
  try {
    D = await chamar('dados');
    const qtd = document.getElementById('qtdRodar');
    if (qtd && qtd.value === '') qtd.value = D.config.LIMITE_DIA || 0; // preenche só na 1ª carga; depois respeita o que foi digitado
    render();
  } catch (e) {
    $('#avisos').innerHTML = `<div class="aviso">Erro ao carregar: ${esc(e.message || e)}</div>`;
  }
}


function trocarAba(aba) {
  abaAtual = aba;
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('ativo', b.dataset.aba === aba));
  document.querySelectorAll('main > section').forEach(s => s.classList.toggle('oculto', s.id !== 'aba-' + aba));
  render();
}


async function acao(botao, fn, ...args) {
  botao.disabled = true;
  try {
    const r = await chamar(fn, ...args);
    toast(r.msg);
    await carregar();
  } catch (e) {
    toast('Erro: ' + (e.message || e));
  } finally {
    botao.disabled = false;
  }
}


async function abrirLead(id) {
  const lead = D.leads.find(l => l.id === id);
  if (!lead) return;
  renderLateral(lead, null);
  try { renderLateral(lead, await chamar('previaLead', id)); } catch (e) { toast('Erro na prévia: ' + e.message); }
}


document.addEventListener('click', async ev => {
  const t = ev.target;
  if (t.closest('#nav button')) return trocarAba(t.closest('#nav button').dataset.aba);
  if (t.id === 'bRodar') return acao(t, 'acaoRodarDia', document.getElementById('qtdRodar').value);
  if (t.id === 'bImportar') return acao(t, 'acaoImportar');
  if (t.id === 'bSync') return acao(t, 'acaoSincronizar');
  if (t.id === 'lFechar') return $('#lateral').classList.add('oculto');
  if (t.id === 'lSalvar') {
    const id = t.dataset.id;
    const lead = D.leads.find(l => l.id === id);
    t.disabled = true;
    try {
      if ($('#lEtapa').value !== lead.etapa) await chamar('moverEtapa', id, $('#lEtapa').value);
      if ($('#lObs').value !== (lead.obs || '')) await chamar('salvarObs', id, $('#lObs').value);
      toast('Lead atualizado.');
      $('#lateral').classList.add('oculto');
      await carregar();
    } catch (e) { toast('Erro: ' + e.message); } finally { t.disabled = false; }
    return;
  }
  if (t.classList.contains('sSalvar')) {
    const p = t.dataset.passo;
    const sel = s => document.querySelector(`${s}[data-passo="${p}"]`).value;
    t.disabled = true;
    try {
      toast((await chamar('salvarPasso', nichoSeq, Number(p), Number(sel('.sDia')), sel('.sAssunto'), sel('.sCorpo'))).msg);
      await carregar();
    } catch (e) { toast('Erro: ' + e.message); } finally { t.disabled = false; }
    return;
  }
  const linha = t.closest('tr.clicavel');
  if (linha) return abrirLead(linha.dataset.id);
  const card = t.closest('.lead-card');
  if (card) return abrirLead(card.dataset.id);
});


document.addEventListener('input', ev => {
  if (ev.target.id === 'fTexto') {
    filtro.texto = ev.target.value;
    clearTimeout(ev.target._h);
    ev.target._h = setTimeout(() => { renderLeads(); const i = $('#fTexto'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }, 250);
  }
});


document.addEventListener('change', ev => {
  if (ev.target.id === 'fEtapa') { filtro.etapa = ev.target.value; renderLeads(); }
  if (ev.target.id === 'fNicho') { filtro.nicho = ev.target.value; renderLeads(); }
  if (ev.target.id === 'sNicho') { nichoSeq = ev.target.value; renderSequencias(); }
});


document.addEventListener('dragstart', ev => {
  const c = ev.target.closest('.lead-card');
  if (c) arrastando = c.dataset.id;
});
document.addEventListener('dragover', ev => {
  const col = ev.target.closest('.coluna');
  if (col && arrastando) { ev.preventDefault(); col.classList.add('sobre'); }
});
document.addEventListener('dragleave', ev => {
  const col = ev.target.closest('.coluna');
  if (col) col.classList.remove('sobre');
});
document.addEventListener('drop', async ev => {
  const col = ev.target.closest('.coluna');
  if (!col || !arrastando) return;
  ev.preventDefault();
  col.classList.remove('sobre');
  const id = arrastando, etapa = col.dataset.etapa;
  arrastando = null;
  const lead = D.leads.find(l => l.id === id);
  if (!lead || lead.etapa === etapa) return;
  lead.etapa = etapa;
  renderFunil();
  try { toast((await chamar('moverEtapa', id, etapa)).msg); } catch (e) { toast('Erro: ' + e.message); await carregar(); }
});


document.addEventListener('DOMContentLoaded', carregar);
// ── FIM BLOCO ──
</script>
</body>
</html>
